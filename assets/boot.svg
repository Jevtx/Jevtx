<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img" aria-labelledby="t d" xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Guilherme Willian, técnico em informática (cursando)</title>
  <desc id="d">Registro de inicialização no estilo Linux: cursando o 4º módulo do técnico em informática; Windows, Ubuntu, Debian, Debian Server e Windows Server instalados; manutenção e montagem de computadores e atendimento ao cliente; projeto Based Libes no ar; procurando estágio ou vaga inicial em suporte e infraestrutura de TI.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 15px; }
    .name { font-size: 26px; font-weight: 700; fill: #e8ebef; }
    .sub  { font-size: 14px; fill: #8b95a1; }
    .br   { fill: #8b95a1; }
    .ok   { fill: #8fbf8f; }
    .msg  { fill: #c9d0d8; }
    .wait { fill: #e3b341; }

    /* A linha fica visível por padrão; a animação só esconde antes da hora (fill-mode backwards). */
    .line { animation: appear .3s ease-out backwards; }
    .l1 { animation-delay: .5s; }
    .l2 { animation-delay: 1.05s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.15s; }
    .l5 { animation-delay: 2.9s; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    /* Único movimento contínuo: o asterisco do "start job" do systemd, indo e voltando. */
    .star { animation: scan 1.5s step-end 3.2s infinite; }
    @keyframes scan {
      0%   { transform: translateX(0); }
      10%  { transform: translateX(9px); }
      20%  { transform: translateX(18px); }
      30%  { transform: translateX(27px); }
      40%  { transform: translateX(36px); }
      50%  { transform: translateX(45px); }
      60%  { transform: translateX(36px); }
      70%  { transform: translateX(27px); }
      80%  { transform: translateX(18px); }
      90%  { transform: translateX(9px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .line, .star { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="819" height="289" rx="10" fill="#181c20" stroke="#2f363e"/>

  <text x="32" y="58" class="name">Guilherme Willian</text>
  <text x="32" y="84" class="sub">Técnico em Informática (Grau Técnico), Ribeirão das Neves, MG</text>

  <g class="line l1">
    <text x="32" y="136" textLength="72" lengthAdjust="spacing"><tspan class="br">[</tspan><tspan class="ok">  OK  </tspan><tspan class="br">]</tspan></text>
    <text x="113" y="136" class="msg">Cursando o 4º módulo, conclusão prevista em 04/2027</text>
  </g>
  <g class="line l2">
    <text x="32" y="164" textLength="72" lengthAdjust="spacing"><tspan class="br">[</tspan><tspan class="ok">  OK  </tspan><tspan class="br">]</tspan></text>
    <text x="113" y="164" class="msg">Instalados: Windows, Ubuntu, Debian, Debian Server, Windows Server</text>
  </g>
  <g class="line l3">
    <text x="32" y="192" textLength="72" lengthAdjust="spacing"><tspan class="br">[</tspan><tspan class="ok">  OK  </tspan><tspan class="br">]</tspan></text>
    <text x="113" y="192" class="msg">Manutenção e montagem de computadores, atendimento ao cliente</text>
  </g>
  <g class="line l4">
    <text x="32" y="220" textLength="72" lengthAdjust="spacing"><tspan class="br">[</tspan><tspan class="ok">  OK  </tspan><tspan class="br">]</tspan></text>
    <text x="113" y="220" class="msg">No ar: Based Libes, sistema web de biblioteca (projeto em grupo)</text>
  </g>
  <g class="line l5">
    <text x="32" y="248" class="br" textLength="72" lengthAdjust="spacing">[      ]</text>
    <text x="41" y="248" class="wait star">*</text>
    <text x="113" y="248" class="msg">Procurando: estágio ou vaga inicial em Suporte e Infraestrutura de TI</text>
  </g>
</svg>
